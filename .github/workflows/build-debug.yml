name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List build outputs
        run: |
          echo "Listing APK outputs:"
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Collect Debug APKs
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/debug/*.apk)
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "Error: No APK file found in app/build/outputs/apk/debug"
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            filename=$(basename "$apk")
            abi="${filename#app-}"
            abi="${abi%-debug-unsigned.apk}"
            abi="${abi%-debug.apk}"
            if [ "$abi" = "$filename" ] || [ -z "$abi" ]; then
              abi="universal"
            fi
            if [ "$abi" = "universal" ]; then
              cp "$apk" "artifacts/Kotatsu-Reimagined Debug (Universal).apk"
              cp "$apk" "artifacts/Kotatsu-Reimagined Debug.apk"
            else
              cp "$apk" "artifacts/Kotatsu-Reimagined Debug (${abi}).apk"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Reimagined Debug
          path: artifacts/*.apk
          if-no-files-found: error

name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          DEST_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$DEST_DIR"
          cd app/build/outputs/apk/debug
          for file in *.apk; do
            if [ -f "$file" ]; then
              if [[ "$file" == *"universal"* ]]; then
                cp "$file" "$DEST_DIR/Kotatsu-Reimagined Debug (Universal).apk"
              elif [[ "$file" == *"arm64-v8a"* ]]; then
                cp "$file" "$DEST_DIR/Kotatsu-Reimagined Debug (arm64-v8a).apk"
              elif [[ "$file" == *"armeabi-v7a"* ]]; then
                cp "$file" "$DEST_DIR/Kotatsu-Reimagined Debug (armeabi-v7a).apk"
              elif [[ "$file" == *"x86_64"* ]]; then
                cp "$file" "$DEST_DIR/Kotatsu-Reimagined Debug (x86_64).apk"
              elif [[ "$file" == *"x86"* ]]; then
                cp "$file" "$DEST_DIR/Kotatsu-Reimagined Debug (x86).apk"
              else
                cp "$file" "$DEST_DIR/Kotatsu-Reimagined Debug ($file)"
              fi
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Reimagined Debug
          path: artifacts/*.apk
